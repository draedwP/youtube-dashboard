name: Collect snapshots and publish
on:
  schedule:
    # Frequent off-hour attempts compensate for delayed or dropped GitHub schedule events.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: channel-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collection age
        id: due
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            let last = 0;
            try { last = Date.parse(JSON.parse(readFileSync("dist/data.json", "utf8")).updatedAt) || 0 } catch {}
            const due = Date.now() - last >= 25 * 60 * 1000;
            appendFileSync(process.env.GITHUB_OUTPUT, `collect=${due}\n`);
            console.log(due ? "Collecting new snapshot" : "Recent snapshot exists; skipping collection");
          '
      - name: Collect views
        if: steps.due.outputs.collect == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/collect.mjs
      - name: Save history
        if: steps.due.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/snapshots.json dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update channel snapshots'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.due.outputs.collect == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.collect == 'true' || github.event_name == 'push'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.due.outputs.collect == 'true' || github.event_name == 'push'
        id: deployment
